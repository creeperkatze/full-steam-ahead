name: Publish to Winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main
        with:
          identifier: Creeperkatze.FullSteamAhead
          installers-regex: '-setup\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
